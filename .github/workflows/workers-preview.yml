name: Workers Preview

# PR 코드를 운영 Worker의 미리보기 버전으로 올리고 PR에 주소를 남긴다.
# 저장소마다 preview.yml 에서 불러 쓴다:
#
#   jobs:
#     preview:
#       if: github.event.pull_request.head.repo.full_name == github.repository
#       permissions:
#         contents: read
#         pull-requests: write
#       uses: DaleStudy/.github/.github/workflows/workers-preview.yml@workers-preview/v1
#       with:
#         worker: coffee
#       secrets:
#         CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

on:
  workflow_call:
    inputs:
      worker:
        description: "wrangler.jsonc 의 name. 미리보기 주소는 pr-<번호>-<worker>.dalestudy.workers.dev"
        type: string
        required: true
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Upload preview version
        id: upload
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: bun
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }}

      - name: Comment
        if: always()
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: cloudflare-workers
          message: |
            ${{ steps.upload.outcome == 'success' && '✅' || '❌' }} 미리보기: https://pr-${{ github.event.pull_request.number }}-${{ inputs.worker }}.dalestudy.workers.dev · [실행 로그](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
