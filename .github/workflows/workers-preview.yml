name: Workers Preview

# PR 코드를 Workers Previews(wrangler preview)로 띄운다. 주소는 GitHub 배포(previews 환경)로 PR에 표시된다.
# 미리보기 설정은 저장소의 wrangler 설정 파일에 있는 previews 블록을 따르고, 오래된 미리보기는 Cloudflare가 정리한다.
# 저장소마다 preview.yml 에서 불러 쓴다:
#
#   jobs:
#     preview:
#       if: github.event.pull_request.head.repo.full_name == github.repository
#       permissions:
#         contents: read
#       uses: DaleStudy/.github/.github/workflows/workers-preview.yml@main
#       secrets:
#         CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: previews
      url: ${{ steps.preview.outputs.preview-url }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Deploy preview
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: bun
          command: preview --name pr-${{ github.event.pull_request.number }} --ignore-base-config
