name: Workers Preview

# PR 코드를 운영 Worker의 미리보기 버전으로 올리고 PR에 주소를 남긴다.
# 저장소마다 preview.yml 에서 불러 쓴다:
#
#   jobs:
#     preview:
#       if: github.event.pull_request.head.repo.full_name == github.repository
#       permissions:
#         contents: read
#         pull-requests: write
#       uses: DaleStudy/.github/.github/workflows/workers-preview.yml@main
#       secrets:
#         CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Upload preview version
        id: upload
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: bun
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }}

      # 미리보기 주소는 wrangler 가 출력한 alias URL 을 그대로 쓴다
      - name: Find preview URL
        id: url
        env:
          OUTPUT: ${{ steps.upload.outputs.command-output }}
        run: |
          url="$(printf '%s\n' "$OUTPUT" | sed -n 's/^Version Preview Alias URL: //p' | head -1)"
          if [ -z "$url" ]; then
            echo "::error::wrangler 출력에서 Version Preview Alias URL 을 찾지 못했습니다"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment
        if: always()
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: cloudflare-workers
          message: |
            ${{ steps.url.outcome == 'success' && format('✅ 미리보기: {0}', steps.url.outputs.url) || '❌ 미리보기를 만들지 못했습니다' }} · [실행 로그](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
